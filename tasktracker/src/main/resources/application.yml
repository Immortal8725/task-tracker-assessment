spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

task:
  scheduler:
    cron: "0 0 * * * ?"  # hourly

jwt:
  secret: superlongbase64secretkey1234567890abcdefghijklmnopqrstuvwxyz==
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000  # 7 days

# Optional: Keep PostgreSQL config for future Docker/prod use
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://db:5432/taskdb
    username: taskuser
    password: taskpass
    driver-class-name: org.postgresql.Driver